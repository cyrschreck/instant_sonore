# Configuration Netlify — L'Instant Sonore (Astro)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirection /admin → /admin/ (slash final pour Decap CMS)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Page Écouter : URLs propres et liens partageables par univers
[[redirects]]
  from = "/ecouter"
  to = "/ecouter.html"
  status = 200
  force = true

[[redirects]]
  from = "/ecouter/hommages"
  to = "/ecouter/hommages.html"
  status = 200
  force = true

[[redirects]]
  from = "/ecouter/transitions"
  to = "/ecouter/transitions.html"
  status = 200
  force = true

[[redirects]]
  from = "/ecouter/celebrations"
  to = "/ecouter/celebrations.html"
  status = 200
  force = true

# Blog : la page liste et le dossier des articles portent le même nom
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
  force = true

# Headers de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
